<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Pong 게임</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: #f5f5f5;
        }

        canvas {
            border: 2px solid black;
            background: #111;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Pong 게임</h1>
    <p>왼쪽 플레이어: W / S | 오른쪽 플레이어: ↑ / ↓</p>
    <p>
        왼쪽 점수: <span id="leftScore">0</span>
        오른쪽 점수: <span id="rightScore">0</span>
    </p>

    <!-- 난이도 선택 버튼 -->
    <p>난이도 선택</p>

    <button onclick="setDifficulty('easy')">쉬움</button>
    <button onclick="setDifficulty('normal')">보통</button>
    <button onclick="setDifficulty('hard')">어려움</button>
    <p>현재 난이도: <span id="difficultyText">보통</span></p>
    <canvas id="gameCanvas" width="700" height="400"></canvas>

<script>

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const leftScoreText = document.getElementById("leftScore");
    const rightScoreText = document.getElementById("rightScore");
    const difficultyText = document.getElementById("difficultyText");

    let leftScore = 0;
    let rightScore = 0;

    let ballSpeed = 5;

    function setDifficulty(difficulty) {

        if (difficulty === "easy") {
            ballSpeed = 1.5;
            difficultyText.textContent = "쉬움";
        }

        if (difficulty === "normal") {
            ballSpeed = 3;
            difficultyText.textContent = "보통";
        }

        if (difficulty === "hard") {
            ballSpeed = 5;
            difficultyText.textContent = "어려움";
        }
        resetBall();
    }

    function drawCenterLine() {
        ctx.setLineDash([10, 10]);
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.strokeStyle = "white";
        ctx.stroke();
        ctx.setLineDash([]);
    }

    const ball = {
        x: canvas.width / 2,
        y: canvas.height / 2,
        radius: 10,
        dx: 5,
        dy: 3
    };

    function drawBall() {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = "white";
        ctx.fill();
    }

    function moveBall() {
        ball.x += ball.dx;
        ball.y += ball.dy;


        if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
            ball.dy *= -1;
        }

        if (ball.x - ball.radius < 0) {
            rightScore++;
            rightScoreText.textContent = rightScore;
            resetBall();
        }

        if (ball.x + ball.radius > canvas.width) {
            leftScore++;
            leftScoreText.textContent = leftScore;
            resetBall();
        }

        if (isBallHittingPaddle(leftPaddle)) {
            ball.dx = Math.abs(ballSpeed);
        }

        if (isBallHittingPaddle(rightPaddle)) {
            ball.dx = -Math.abs(ballSpeed);
        }
    }

    function isBallHittingPaddle(paddle) {
        return (
            ball.x - ball.radius < paddle.x + paddle.width &&
            ball.x + ball.radius > paddle.x &&
            ball.y - ball.radius < paddle.y + paddle.height &&
            ball.y + ball.radius > paddle.y
        );
    }

    const keys = {};

    document.addEventListener("keydown", function(event) {
        keys[event.key] = true;
    });

    document.addEventListener("keyup", function(event) {
        keys[event.key] = false;
    });

    function movePaddles() {
        if (keys["w"] || keys["W"]) {
            leftPaddle.y -= leftPaddle.speed;
        }

        if (keys["s"] || keys["S"]) {
            leftPaddle.y += leftPaddle.speed;
        }

        if (keys["ArrowUp"]) {
            rightPaddle.y -= rightPaddle.speed;
        }

        if (keys["ArrowDown"]) {
            rightPaddle.y += rightPaddle.speed;
        }
        keepPaddleInside(leftPaddle);
        keepPaddleInside(rightPaddle);
    }

    function keepPaddleInside(paddle) {
        if (paddle.y < 0) {
            paddle.y = 0;
        }

        if (paddle.y + paddle.height > canvas.height) {
            paddle.y = canvas.height - paddle.height;
        }
    }

    function resetBall() {
        ball.x = canvas.width / 2;
        ball.y = canvas.height / 2;

        ball.dx = ballSpeed;

        if (Math.random() < 0.5) {
            ball.dx *= -1;
        }
        ball.dy = Math.random() * 6 - 3;
        if (ball.dy === 0) {
            ball.dy = 2;
        }
    }

    const paddleWidth = 12;
    const paddleHeight = 80;

    const leftPaddle = {
        x: 30,
        y: canvas.height / 2 - paddleHeight / 2,
        width: paddleWidth,
        height: paddleHeight,
        speed: 6
    };

    const rightPaddle = {
        x: canvas.width - 30 - paddleWidth,
        y: canvas.height / 2 - paddleHeight / 2,
        width: paddleWidth,
        height: paddleHeight,
        speed: 6
    };

    function drawRect(rect) {
        ctx.fillStyle = "white";
        ctx.fillRect(
            rect.x,
            rect.y,
            rect.width,
            rect.height
        );
    }

    function drawGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawCenterLine();
        movePaddles();
        moveBall();
        drawBall();
        drawRect(leftPaddle);
        drawRect(rightPaddle);
        requestAnimationFrame(drawGame);
    }
    drawGame();
</script>
</body>
</html>
