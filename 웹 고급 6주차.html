<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Snake 게임</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        canvas {
            border: 2px solid black;
            background: #f9f9f9;
        }

        button {
            margin: 5px;
            padding: 8px 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Snake 게임</h1>
    <p>점수: <span id="score">0</span></p>
    <p>조작: 방향키 ↑ ↓ ← →</p>

    <p>난이도 선택</p>
    <button onclick="setDifficulty(500)">쉬움</button>
    <button onclick="setDifficulty(300)">보통</button>
    <button onclick="setDifficulty(150)">어려움</button>

    <br>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreText = document.getElementById("score");
        let score = 0;

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };

        let dx = 1;
        let dy = 0;

        let nextDx = 1;
        let nextDy = 0;

        let gameOver = false;
        let moveCount = 0;

        let gameSpeed = 500;
        let foodSpeed = 1000;

        let gameTimer = null;
        let foodTimer = null;

        function setDifficulty(speed) {
            gameSpeed = speed;
            foodSpeed = speed * 2;

            if (gameTimer !== null) {
                clearInterval(gameTimer);
            }

            if (foodTimer !== null) {
                clearInterval(foodTimer);
            }

            score = 0;
            scoreText.textContent = score;

            snake = [{ x: 10, y: 10 }];

            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;

            moveCount = 0;
            gameOver = false;

            moveFood();
            drawGame();

            gameTimer = setInterval(gameLoop, gameSpeed);
            foodTimer = setInterval(moveFoodRandom, foodSpeed);
        }

        function drawTile(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(
                x * gridSize,
                y * gridSize,
                gridSize - 2,
                gridSize - 2
            );
        }

        function drawSnake() {
            for (let i = 0; i < snake.length; i++) {
                if (i == 0) {
                    drawTile(snake[i].x, snake[i].y, "green");
                }
                else {
                    drawTile(snake[i].x, snake[i].y, "Limegreen");
                }
            }
        }

        function drawFood() {
            drawTile(food.x, food.y, "red");
        }

        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawSnake();
            drawFood();
        }

        document.addEventListener("keydown", changDirection);

        function changDirection(event) {
            if (event.key === "ArrowUp" && dy !== 1) {
                nextDx = 0;
                nextDy = -1;
            }

            if (event.key === "ArrowDown" && dy !== -1) {
                nextDx = 0;
                nextDy = 1;
            }

            if (event.key === "ArrowLeft" && dx !== 1) {
                nextDx = -1;
                nextDy = 0;
            }

            if (event.key === "ArrowRight" && dx !== -1) {
                nextDx = 1;
                nextDy = 0;
            }
        }

        function moveSnake() {
            dx = nextDx;
            dy = nextDy;

            const head = {
                x: snake[0].x + dx,
                y: snake[0].y + dy
            };

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreText.textContent = score;
                moveFood();
            }
            else {
                snake.pop();
            }

            moveCount++;

            if (moveCount >= 2) {
                moveCount = 0;
            }
        }

        function moveFood() {
            let available = [];

            for (let x = 0; x < tileCount; x++) {
                for (let y = 0; y < tileCount; y++) {
                    const onSnake = snake.some(part =>
                        part.x === x && part.y === y
                    );

                    if (!onSnake) {
                        available.push({ x: x, y: y });
                    }
                }
            }

            if (available.length > 0) {
                food = available[
                    Math.floor(Math.random() * available.length)
                ];
            }
        }

        function moveFoodRandom() {
            if (gameOver) return;

            const directions = [
                { x: 0, y: -1 },
                { x: 0, y: 1 },
                { x: -1, y: 0 },
                { x: 1, y: 0 }
            ];

            const start = Math.floor(Math.random() * 4);

            for (let i = 0; i < 4; i++) {
                const dir = directions[(start + i) % 4];

                const newX = food.x + dir.x;
                const newY = food.y + dir.y;

                const insideBoard =
                    newX >= 0 && newX < tileCount &&
                    newY >= 0 && newY < tileCount;

                const onSnake = snake.some(part => part.x === newX && part.y === newY);

                if (insideBoard && !onSnake) {
                    food.x = newX;
                    food.y = newY;
                    drawGame();
                    return;
                }
            }
        }

        function checkCollision() {
            const head = snake[0];

            if (
                head.x < 0 ||
                head.x >= tileCount ||
                head.y < 0 ||
                head.y >= tileCount
            ) {
                endGame();
                return;
            }

            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }
        }

        function endGame() {
            gameOver = true;

            if (gameTimer !== null) {
                clearInterval(gameTimer);
                gameTimer = null;
            }

            if (foodTimer !== null) {
                clearInterval(foodTimer);
                foodTimer = null;
            }

            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = "32px Arial";
            ctx.fillStyle = "white";
            ctx.textAlign = "center";

            ctx.fillText("게임 오버!", canvas.width / 2, canvas.height / 2 - 20);
            ctx.fillText("점수 : " + score, canvas.width / 2, canvas.height / 2 + 30);
        }

        function gameLoop() {
            if (gameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            moveSnake();
            checkCollision();

            if (gameOver) return;

            drawSnake();
            drawFood();
        }

        setDifficulty(500);
    </script>

</body>

</html>
